name: Deploy blog

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'content/**'
      - 'scripts/**'
      - 'src/**'
      - 'vite.config.js'
      - 'svelte.config.js'
      - '.github/workflows/deploy-blog.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: deploy-blog
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a3a5911ecafc53a38970c6bf2bfba0d4
      PAGES_BRANCH: main
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: latest
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Verify Cloudflare token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::El secret CLOUDFLARE_API_TOKEN no está definido. Añádelo en Settings → Secrets and variables → Actions del repositorio."
            exit 1
          fi
          echo "Token configurado (longitud: ${#CLOUDFLARE_API_TOKEN})."
      - name: Install Wrangler
        run: npm install -g wrangler@4.93.0
      - name: Build and deploy the site
        run: bash scripts/deploy-site.sh
